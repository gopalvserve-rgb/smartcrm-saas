  <g font-size="13.5">
    <text x="532" y="600" font-weight="800" fill="#0f2540">Subject: Welcome!<tspan x="532" dy="24" font-weight="400" fill="#334155">Thanks for reaching</tspan><tspan x="532" dy="22" font-weight="400" fill="#334155">out to us. We are</tspan><tspan x="532" dy="22" font-weight="400" fill="#334155">excited to help you.</tspan></text>
    <text x="732" y="600" font-weight="800" fill="#0f2540">Subject: More Info<tspan x="732" dy="24" font-weight="400" fill="#334155">Here's more info that</tspan><tspan x="732" dy="22" font-weight="400" fill="#334155">might help you make</tspan><tspan x="732" dy="22" font-weight="400" fill="#334155">the right decision.</tspan></text>
    <text x="932" y="600" font-weight="800" fill="#0f2540">Subject: Case Study<tspan x="932" dy="24" font-weight="400" fill="#334155">See how our solution</tspan><tspan x="932" dy="22" font-weight="400" fill="#334155">delivered real results</tspan><tspan x="932" dy="22" font-weight="400" fill="#334155">for our clients.</tspan></text>
    <text x="1132" y="600" font-weight="800" fill="#0f2540">Subject: Let's Talk<tspan x="1132" dy="24" font-weight="400" fill="#334155">Would you like to</tspan><tspan x="1132" dy="22" font-weight="400" fill="#334155">schedule a quick call</tspan><tspan x="1132" dy="22" font-weight="400" fill="#334155">with our expert?</tspan></text>
    <text x="1332" y="600" font-weight="800" fill="#0f2540">Subject: Still Need<tspan x="1332" dy="24" font-weight="400" fill="#334155">Help? We're always</tspan><tspan x="1332" dy="22" font-weight="400" fill="#334155">here to support you.</tspan></text>
