    <text x="932" y="338">Hi {{Name}},<tspan x="932" dy="22">Here's a case study</tspan><tspan x="932" dy="22">on how we helped</tspan><tspan x="932" dy="22">businesses like yours.</tspan></text>
    <text x="1132" y="338">Hi {{Name}},<tspan x="1132" dy="22">Any questions we</tspan><tspan x="1132" dy="22">can answer before</tspan><tspan x="1132" dy="22">you decide?</tspan></text>
    <text x="1332" y="338">Hi {{Name}},<tspan x="1332" dy="22">Just following up.</tspan><tspan x="1332" dy="22">We're here when</tspan><tspan x="1332" dy="22">you're ready.</tspan></text>
  </g>
