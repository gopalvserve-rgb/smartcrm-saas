  <g font-size="14" fill="#15412c">
    <text x="532" y="338">Hi {{Name}},<tspan x="532" dy="22">Thanks for showing</tspan><tspan x="532" dy="22">interest in our</tspan><tspan x="532" dy="22">solution.</tspan><tspan x="532" dy="22">How can we help?</tspan></text>
